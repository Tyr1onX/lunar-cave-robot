    #   #*******************************************************************************
    #   # GoalTolerance 目标容差
    #   #*******************************************************************************
    #   free_goal_vel: True      #允许机器人以最大速度驶向目的地，为False时，车到达终点时的目标速度为0；

    #   #*******************************************************************************
