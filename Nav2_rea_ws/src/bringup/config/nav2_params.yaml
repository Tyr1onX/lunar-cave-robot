controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0 #控制频率
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3 #最大容忍时间 超过后会触发恢复行为
    progress_checker_plugin: "progress_checker" #
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 999.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25 #0.25米以内
      yaw_goal_tolerance: 6.28 #360度以内
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 80
      model_dt: 0.02
      batch_size: 1500
      vx_std: 0.3
      vy_std: 0.3
      wz_std: 0.2
      vx_max: 0.6
      vx_min: -0.6
      vy_max: 0.0
      vy_min: 0.0
      wz_max: 1.5
      ax_max: 2.0
      ax_min: -2.0
      ay_max: 1.5
      ay_min: -5.0
      az_max: 3.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.25
      gamma: 0.02
      motion_model: "DiffDrive"
      visualize: true
      reset_period: 0.08
      regenerate_noises: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic: #是否违反速度约束
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic: #主要负责躲避障碍
        enabled: true
        cost_power: 1
        cost_weight: 3.80 #躲避障碍的代价权重
        critical_cost: 253.0 #接近致命障碍的代价阈值
        consider_footprint: false #
        collision_cost: 1000000.0 #碰撞代价
        near_goal_distance: 0.5 #在这个距离内，障碍物代价会被降低，以帮助机器人更容易地到达目标
        trajectory_point_step: 2 #
      GoalCritic: #确保机器人接近目标
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        threshold_to_consider: 2.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.8
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic: #是否跟随全局路径
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic: #确保机器人朝向与全局路径一致 
        enabled: true
        cost_power: 1
        cost_weight: 0.5
        offset_from_furthest: 5
        threshold_to_consider: 1.0
        max_angle_to_furthest: 1.0
        mode: 0


    # FollowPath:
    #   plugin: teb_local_planner::TebLocalPlannerROS
    #   #*******************************************************************************
    #   # Trajectory
    #   #*******************************************************************************
    #   teb_autosize: 0.05                             #是否自动调整轨迹大小。根据时间分辨率自动调整轨迹大小
    #   dt_ref: 0.35                                   #轨迹的期望时间分辨率（应该与底层控制速率的数量级相符）
    #   dt_hysteresis: 0.035                           #自动调整大小的滞后（根据当前时间分辨率 dt）：通常为 dt_ref 的 10%
    #   max_samples: 1000                              #最大样本数量；警告：如果太小，离散化/分辨率可能不足以用于给定的机器人模型，或者避障不再有效。
    #   global_plan_overwrite_orientation: True       #覆盖全局规划器提供的局部子目标的方向
    #   allow_init_with_backwards_motion: False        #如果为真，基础轨迹可能会以后退运动初始化，以防目标在本地代价地图中位于起点之后（仅当机器人配备后部传感器时推荐）
    #   max_global_plan_lookahead_dist: -2.0           #指定用于优化考虑的全局规划子集的最大长度（累积欧氏距离）[如果 <=0：禁用；长度也受到本地代价地图大小的限制！
    #   force_reinit_new_goal_dist: 0.8               #如果之前的目标更新距离超过此值，则强制规划器重新初始化轨迹
    #   force_reinit_new_goal_angular: 0.78           #如果之前的目标更新的角度超过此弧度值，则强制规划器重新初始化轨迹
    #   feasibility_check_no_poses: 15                 #在预测路径上，每个采样间隔需要检查可行性的姿态数目
    #   feasibility_check_lookahead_distance: 1.5     #每个采样间隔需要检查可行性的距离（以及feasibility_check_no_poses之下的索引）与机器人之间的距离。-1检查所有姿势，直到feasibility_check_no_poses。https://robotics.stackexchange.com/questions/80845/what-are-reasons-for-teb-planners-feasibility-check-to-fail
    #   exact_arc_length: False                       #如果为真，规划器在速度、加速度和转向率计算中使用准确的弧长 [-> 增加 CPU 时间]，否则使用欧氏近似。
    #   publish_feedback: False                       #发布包含完整轨迹和活动障碍物列表的规划器反馈（应仅用于评估或调试目的）
    #   visualize_with_time_as_z_axis_scale: 0.0      #在rviz里可看到优化使用的graph

    #   #*******************************************************************************
    #   # ViaPoints 中间点
    #   #*******************************************************************************
    #   global_plan_viapoint_sep: 0.5         #从全局计划中提取的连续中间点之间的最小分离距离
    #   via_points_ordered: False             #是否遵循存储容器中中间点的顺序

    #   #*******************************************************************************
    #   # Robot
    #   #*******************************************************************************
    #   max_vel_x: 10.0                        #最大平移速度
    #   max_vel_x_backwards: 10.0              #最大后退速度
    #   max_vel_theta: 12.56                    #最大转向角速度
    #   acc_lim_x: 12.0                        #最大平移加速度
    #   acc_lim_theta: 12.28                    #最大角加速度
    #   is_footprint_dynamic: False           #如果为真，在检查轨迹可行性之前更新足迹
    #   use_proportional_saturation: False    #如果为true，则按比例减少所有扭曲分量（线性x和y以及角度z）（如果任何扭曲分量超过其相应的界限），而不是单独饱和每个扭曲分量
    #   transform_tolerance: 0.5              #在TF树中查询转换时的容差（秒）

    #   #*******************************************************************************
    #   #Robot/Carlike 此部分参数仅适用于类似汽车的机器人（如差速驱动机器人）
    #   #*******************************************************************************
    #   min_turning_radius: 0.5             #机器人的最小转弯半径。对于差速驱动机器人，此值为0
