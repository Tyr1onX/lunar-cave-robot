chassis_serial_bridge:
  ros__parameters:
    # Empty by default so launching the node cannot select a physical serial port accidentally.
    # Nav2 launch requires an explicit chassis_device argument.
    device_name: ""
    baud_rate: 115200
    command_topic: "/cmd_vel"
    # Separate input, serialized by the same bridge that owns the chassis UART.
    # Keep disabled until the installed STM32 firmware is verified for raw VY tokens.
    pusher_command_topic: "/chassis/pusher_command"
    pusher_status_topic: "/chassis/pusher_status"
    pusher_commands_enabled: false
    pusher_command_timeout_ms: 500
    tx_period_ms: 20
    command_timeout_ms: 100
    max_linear_x: 0.6
    max_angular_z: 1.5
    max_linear_y_abs: 0.01
    unsupported_axis_tolerance: 0.01
