/**:
  ros__parameters:
    device_name: "/dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_316236633233-if00"
    baud_rate: 9600
    flow_control: "none"
    parity: "none"
    stop_bits: "1"

    # Navigation/chassis serial fields are still kept in the packet prefix.
    # Do not remove the serial parameters above when only the arm is being tested.

    # Upper computer <-> lower computer arm serial bridge.
    # Subscribes to tzb_catch arm command and sends 6 joint angles at 100 Hz.
    tzb.arm_serial_enabled: true
    tzb.include_arm_serial_extension: true
    # The dependency logs one error per cancelled async read when the cable is unplugged.
    # Suppress that expected flood; rm_serial_driver still reports reconnect failures throttled.
    tzb.suppress_expected_serial_abort_logs: true
    tzb.arm_command_topic: "/tzb_catch/arm_joint_command"
    tzb.arm_state_topic: "/serial/arm_joint_state"
    # std_msgs/Int8: 1 closes, -1 opens, and 0 holds the current gripper state.
    # Start in hold until an explicit command arrives.
    tzb.gripper_command_topic: "/tzb_catch/gripper_command"
    # Print the actual gripper_command sent on the serial wire at this interval.
    # Set to 0.0 to print on every serial packet.
    tzb.gripper_command_log_interval_sec: 5.0
    # This sequence is fixed to the STM32 wire order; incoming JointState names may be shuffled.
    tzb.arm_joint_names: ["J1_joint", "J2_joint", "J3_joint", "J4_joint", "J5_joint", "J6_joint"]
    # ROS joint-space bounds copied from tzb_description/urdf/tzb_description.urdf.
    tzb.arm_joint_lower_limits_rad: [-1.5708, -1.1345, -2.618, -2.8798, -1.578, -2.8798]
    tzb.arm_joint_upper_limits_rad: [3.6652, 1.1345, 2.618, 2.8798, 1.5708, 2.8798]
    # Unit used only on the binary serial wire for arm joint angles.
    # ROS JointState and planner parameters stay in radians unless their own YAML says otherwise.
    tzb.arm_serial_angle_unit: "rad"
    tzb.arm_command_publish_hz: 100.0
    tzb.arm_command_speed_scale: 1.0
    tzb.arm_command_goal_tolerance_rad: 0.005
    # Keep this hard limiter aligned with lite_motion_planner.
    tzb.max_arm_command_velocity_rad_s: [1.2, 1.2, 1.2, 1.8, 1.8, 2.2]
    tzb.arm_command_publish_during_replay: false
    tzb.sequence_loop: false
    tzb.loop_pause_sec: 0.5
