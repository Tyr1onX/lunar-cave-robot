# Simulation-only overrides. The real tzb_planner.yaml and pose_estimator
# parameters are read and left untouched; demo.launch.py layers this file into
# uniquely named temporary parameter files before launching the pipeline.

pose_estimation_node:
  ros__parameters:
    # A 5 Hz synthetic cloud plus CPU inference needs more ROI lifetime than
    # the real camera stream. The node name matches pose_estimator.launch.py.
    roi_timeout_sec: 2.0
    target_class: blue_block

tzb_catch:
  ros__parameters:
    tzb.pose_estimator_continuous_required_sec: 0.4
    tzb.pose_estimator_continuous_max_gap_sec: 1.0
    # Use the existing production downward grasp orientation in this simulation.
    # Only the target coordinates are perception-derived; the planner still solves IK and path.
    tzb.force_target_roll: true
    tzb.force_target_pitch: true
    tzb.force_target_yaw: true
    tzb.forced_target_roll: -3.14
    tzb.forced_target_pitch: 0.0
    tzb.forced_target_yaw: 0.0
    tzb.position_only_target: false
    # Keep measured object pose for collision geometry; raise only the TCP grasp point.
    tzb.grasp_tcp_offset_xyz: [0.0, 0.0, 0.02]
    # Keep planner command samples slow enough for the Gazebo physics plant.
    tzb.arm_command_speed_scale: 0.35
    tzb.arm_motion_feedback_timeout_sec: 45.0
    # At 1.62 m/s^2, a 0.54 m drop takes about 0.82 s; let the block land before retreat.
    tzb.release_settle_sec: 1.25
    tzb.arm_motion_goal_tolerance_rad: 0.05
    # Stay away from physical joint end stops so the planner receives a valid start state.
    tzb.ini_joint_positions: [0.0, 0.8, -2.30, 0.0, 0.0, 0.0]
    tzb.observe_joint_positions: [0.0, 0.0, -1.85, 0.0, 1.40, 0.0]
    # Reach outside the base footprint while keeping the downward tool orientation.
    tzb.place_joint_positions: [3.14, -0.825, -0.5, 0.0, 1.125, 0.0]
    tzb.pose_estimator_wait_timeout_sec: 25.0
    tzb.arm_feedback_enabled: true
    tzb.require_arm_feedback_for_completion: true
    tzb.arm_state_topic: /serial/arm_joint_state
    tzb.pose_estimator_target_topic: /pose_estimator/object_pose
    tzb.replay_after_complete: false
    tzb.replay_loop: false
    tzb.sequence_loop: false

/**:
  ros__parameters:
    # Render the virtual controller's measured state in RViz instead of
    # replaying the planner's theoretical trajectory as robot joint feedback.
    visualization_joint_states_topic: /serial/arm_joint_state
    publish_joint_states_for_visualization: false
    enable_joint_state_playback: false
