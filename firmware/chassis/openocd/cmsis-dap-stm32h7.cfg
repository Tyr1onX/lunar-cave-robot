# TaKe wireless probe: CMSIS-DAP over the SWD transport.
source [find interface/cmsis-dap.cfg]
transport select swd

# Use a conservative rate for the wireless SWD link. Some CMSIS-DAP probes
# quantize this request and may report a nearby effective clock.
adapter speed 500

# The controller used by this project belongs to the STM32H7 family.
source [find target/stm32h7x.cfg]

# Do not require a physical NRST wire. Request reset through the Cortex-M
# debug port, which matches the usual Keil CMSIS-DAP setup. If this cannot
# recover a target whose firmware disables debugging or continuously resets,
# connect the probe's RST signal and use connect-under-reset instead.
reset_config none
cortex_m reset_config sysresetreq
