name: tzb_sim offline ROS 2 build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  humble-build:
    name: Build tzb_sim in ROS 2 Humble
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package and validate simulation assets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network bridge \
            --env ROS_DOMAIN_ID=214 \
            --env ROS_LOCALHOST_ONLY=1 \
            --volume "$GITHUB_WORKSPACE/tzb_ws/src:/workspace/src:ro" \
            ros:humble-ros-base \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-colcon-common-extensions
              source /opt/ros/humble/setup.bash
              mkdir -p /tmp/tzb-sim-build
              cd /tmp/tzb-sim-build
              colcon build --base-paths /workspace/src --packages-select tzb_sim --event-handlers console_direct+
              python3 - <<"PY"
          import ast
          from pathlib import Path
          import struct
          root = Path("/workspace/src/tzb_sim")
          for source in [root / "launch/demo.launch.py", *sorted((root / "tzb_sim").glob("*.py"))]:
              ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
          mesh = (root / "config/blue_block.stl").read_bytes()
          assert len(mesh) >= 84, "binary STL header is truncated"
          triangles = struct.unpack_from("<I", mesh, 80)[0]
          assert triangles > 0 and len(mesh) == 84 + 50 * triangles, "binary STL size does not match its triangle count"
          print(f"PASS Python syntax and binary STL: {triangles} triangles")
          PY
              bash -n /workspace/src/tzb_sim/tools/start_offline_demo.sh
              bash -n /workspace/src/tzb_sim/tools/stop_offline_demo.sh
            '
