name: Console tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-tests:
    name: Read-only Agent Python tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Agent tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools/console-agent" python -m unittest discover \
            -s tools/console-agent/tests \
            -v

  point-lio-runtime-log-safety:
    name: Point-LIO disabled-log safety regression
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify disabled logs are not created or truncated
        shell: bash
        run: |
          set -euo pipefail
          source_file="Nav2_rea_ws/src/localization/point_lio/test/runtime_log_guard_test.cpp"
          include_dir="Nav2_rea_ws/src/localization/point_lio/include"
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -I"$include_dir" "$source_file" \
            -o "$RUNNER_TEMP/point-lio-runtime-log-guard-test"
          "$RUNNER_TEMP/point-lio-runtime-log-guard-test"

  ros2-pointcloud-benchmark:
    name: Isolated ROS 2 PointCloud2 load benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run synthetic PointCloud2 benchmark in isolated ROS 2 container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lunar-ros-results"
          docker run --rm --network bridge \
            --env ROS_DOMAIN_ID=47 \
            --env ROS_LOCALHOST_ONLY=1 \
            --env RMW_IMPLEMENTATION=rmw_fastrtps_cpp \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/lunar-ros-results:/results" \
            ros:humble-ros-base \
            bash -lc 'source /opt/ros/humble/setup.bash; set -eo pipefail; export PYTHONPATH="/workspace/tools/console-agent${PYTHONPATH:+:$PYTHONPATH}"; python3 /workspace/tools/console-agent/scripts/benchmark_link_telemetry.py --report /results/link-telemetry-benchmark.json; python3 /workspace/tools/console-agent/acceptance/pipeline_synthetic_scenarios.py --report /results/pipeline-diagnostics-synthetic.json'

      - name: Upload benchmark baseline and load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-readonly-telemetry-synthetic-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lunar-ros-results/link-telemetry-benchmark.json
            ${{ runner.temp }}/lunar-ros-results/pipeline-diagnostics-synthetic.json
          if-no-files-found: warn
          retention-days: 14

  mac-console-tests:
    name: SwiftUI Console tests
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Run Console tests
        run: swift test --package-path tools/mac-console

      - name: Build Console app bundle
        run: tools/mac-console/Scripts/build-app.sh

      - name: Upload Console app bundle
        uses: actions/upload-artifact@v4
        with:
          name: lunar-robot-console-${{ github.sha }}
          path: tools/mac-console/.build/Lunar Robot Console.app/
          if-no-files-found: error
          retention-days: 14
