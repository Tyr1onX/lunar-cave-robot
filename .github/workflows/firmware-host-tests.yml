name: Firmware host tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-host-tests:
    name: Host-only firmware logic
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run chassis protocol parser tests
        shell: bash
        run: |
          set -euo pipefail
          export XDG_STATE_HOME="$RUNNER_TEMP/lunar-cave-ci-state"
          firmware/chassis/tests/host/run.sh "$RUNNER_TEMP/lunar-cave-chassis-host"

      - name: Run required safety and integration tests
        shell: bash
        run: |
          set -euo pipefail
          export XDG_STATE_HOME="$RUNNER_TEMP/lunar-cave-ci-state"
          test -f firmware/chassis/tests/host/test_chassis_safety.c
          test -x firmware/arm/tests/host/run_safety_state_tests.sh
          test -x firmware/arm/tests/host/run_integration_tests.sh
          firmware/arm/tests/host/run_safety_state_tests.sh "$RUNNER_TEMP/lunar-cave-arm-safety"
          firmware/arm/tests/host/run_integration_tests.sh "$RUNNER_TEMP/lunar-cave-arm-integration"
